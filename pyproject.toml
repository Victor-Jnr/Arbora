[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbora"
version = "0.1.0a0"
description = "A personalised digital assistant that understands your goals, respects your control, and automates your Windows system safely."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Arbora contributors" }]
keywords = ["assistant", "automation", "windows", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "cryptography>=42.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arbora = "arbora.cli.main:main"
arbora-ui = "apps.desktop_chat.app:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["arbora*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
